<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话助手</title>

    <!-- 引入 marked.js 和 highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* ==================== CSS 变量系统 ==================== */
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --sidebar-bg: rgba(255,255,255,0.95);
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --border-color: #e2e8f0;
            --accent-color: #667eea !important;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.1);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
            --card-shadow: 0 4px 20px rgba(0,0,0,0.08);
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --timestamp-color: #a0aec0;
        }

        [data-theme="dark"] {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #404040;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
            --shadow-lg: 0 10px 50px rgba(0,0,0,0.6);
            --timestamp-color: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-gradient);
            height: 100vh;
            display: flex;
            transition: var(--transition);
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .chat-container {
            flex: 1;
            height: calc(100vh - 20px);
            background: var(--bg-primary);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 10px;
            margin-left: 270px;
        }
        .chat-container.sidebar-collapsed {
            margin-left: 10px;
        }

        .chat-header {
            background: linear-gradient(135deg, rgba(102,126,234,0.95) 0%, rgba(118,75,162,0.95) 100%);
            backdrop-filter: blur(10px);
            color: white;
            padding: 24px 28px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        /* 🆕 工具栏按钮组 */
        .toolbar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .toolbar-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: var(--transition);
            position: relative;
        }

        .toolbar-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .toolbar-btn:active {
            transform: translateY(0);
        }

        /* 🆕 工具提示 */
        .toolbar-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -35px;
            right: 0;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .toolbar-btn:hover::after {
            opacity: 1;
        }

        /* 🆕 快捷键提示面板 */
        .shortcuts-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--bg-primary);
            border-radius: 15px;
            padding: 30px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            max-width: 500px;
            width: 90%;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .shortcuts-panel.active {
            opacity: 1;
            pointer-events: all;
            transform: translate(-50%, -50%) scale(1);
        }

        .shortcuts-panel h2 {
            color: var(--text-primary);
            margin-bottom: 20px;
            text-align: center;
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }

        .shortcut-key {
            background: var(--primary-gradient);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
        }

        .shortcut-desc {
            color: var(--text-secondary);
        }

        .close-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .close-panel:hover {
            color: var(--text-primary);
            transform: rotate(90deg);
        }

        /* 🆕 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .control-panel {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 14px;
            font-weight: 500;
        }

        select {
            padding: 8px 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        select:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
        }

        select option {
            background: #667eea;
            color: white;
        }

        .btn-clear {
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
        }

        .btn-clear:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .status-indicator {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px !important;
            font-size: 12px;
            margin-top: 8px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-secondary);
            transition: var(--transition);
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-items: flex-end;
        }

        .message.ai {
            align-items: flex-start;
        }

        /* 🆕 时间戳样式 */
        .message-timestamp {
            font-size: 11px;
            color: var(--timestamp-color);
            margin-bottom: 4px;
            padding: 0 5px;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px !important;
            word-wrap: break-word;
            line-height: 1.6;
            transition: var(--transition);
            position: relative;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102,126,234,0.3);
        }

        .message.ai .message-content {
            background: var(--bg-primary);
            color: var(--text-primary);
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        /* Markdown 样式 */
        .message.ai .message-content h1,
        .message.ai .message-content h2,
        .message.ai .message-content h3 {
            margin-top: 16px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .message.ai .message-content h1 {
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 4px;
        }

        .message.ai .message-content h2 {
            font-size: 1.3em;
        }

        .message.ai .message-content h3 {
            font-size: 1.1em;
        }

        .message.ai .message-content p {
            margin: 8px 0;
        }

        .message.ai .message-content ul,
        .message.ai .message-content ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .message.ai .message-content li {
            margin: 4px 0;
        }

        .message.ai .message-content blockquote {
            border-left: 4px solid #667eea;
            padding-left: 12px;
            margin: 12px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        .message.ai .message-content a {
            color: #667eea !important;
            text-decoration: none;
        }

        .message.ai .message-content a:hover {
            text-decoration: underline;
        }

        .message.ai .message-content strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .message.ai .message-content em {
            color: var(--text-secondary);
        }

        .message.ai .message-content hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 16px 0;
        }

        /* 代码块样式 */
        .message.ai .message-content pre {
            background: var(--code-bg);
            border-radius: 8px;
            padding: 16px;
            margin: 12px 0;
            overflow-x: auto;
            position: relative;
        }

        .message.ai .message-content pre code {
            background: transparent;
            padding: 0;
            border-radius: 0;
            color: var(--code-text);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.ai .message-content code {
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            color: #e83e8c;
        }

        .code-lang {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.1);
            color: var(--code-text);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 85px;
            background: rgba(255,255,255,0.12);
            color: var(--code-text);
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }

        .copy-btn.copied {
            background: #10b981;
            color: white;
            box-shadow: 0 2px 8px rgba(16,185,129,0.3);
        }

        .message.ai .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
        }

        .message.ai .message-content table th,
        .message.ai .message-content table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: left;
        }

        .message.ai .message-content table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .message.ai .message-content table tr:nth-child(even) {
            background: var(--bg-secondary);
        }

        .chat-input-area {
            padding: 20px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-y: auto;
            max-height: 150px;
        }

        #userInput:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }

        #sendBtn {
            padding: 14px 36px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(102,126,234,0.3);
            letter-spacing: 0.5px;
        }

        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102,126,234,0.4);
        }

        #sendBtn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(102,126,234,0.3);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 10px;
            color: var(--text-secondary);
        }

        .loading.active {
            display: block;
        }

        /* 🆕 通知提示 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            border-left: 4px solid #4caf50;
        }

        .notification.error {
            border-left: 4px solid #f44336;
        }

        .notification.info {
            border-left: 4px solid #2196f3;
        }

        @media (max-width: 768px) {
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }

            .control-panel {
                flex-direction: column;
                gap: 8px;
            }

            .toolbar {
                top: 10px;
                right: 10px;
            }

            .toolbar-btn {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
        }

        /* ==================== 侧边栏样式 ==================== */
        .sidebar {
            position: fixed;
            left: 10px;
            top: 10px;
            bottom: 10px;
            width: 260px;
            min-width: 180px;
            max-width: 400px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: none;
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: 4px 0 24px rgba(0,0,0,0.08);
        }
        .sidebar.collapsed { 
            transform: translateX(calc(-100% + 8px)); 
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .sidebar-title { font-size: 15px; font-weight: 700; color: var(--text-primary); }
        .sidebar-new-btn {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(102,126,234,0.25);
            letter-spacing: 0.5px;
        }
        .sidebar-new-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102,126,234,0.35);
        }

        /* 自定义滚动条容器 */
        .sidebar-list-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .sidebar-list {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            padding: 8px;
            padding-right: 20px;
        }
        /* 隐藏原生滚动条 */
        .sidebar-list::-webkit-scrollbar { width: 0; height: 0; }
        .sidebar-list { scrollbar-width: none; }
        
        /* 自定义滚动条 */
        .custom-scrollbar {
            position: absolute;
            right: 2px;
            top: 8px;
            bottom: 8px;
            width: 6px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 3px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .sidebar-list-wrapper:hover .custom-scrollbar,
        .sidebar-list-wrapper.scrollable .custom-scrollbar {
            opacity: 1;
        }
        
        .custom-scrollbar-thumb {
            position: absolute;
            left: 0;
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        }
        .custom-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #7c8ff0 0%, #8b5bb3 100%);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
            transform: scaleX(1.1);
        }

        .sidebar-loading {
            text-align: center; padding: 30px 0; color: var(--text-secondary); font-size: 13px;
        }

        .sidebar-item {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            margin-bottom: 4px;
            transition: var(--transition);
            position: relative;
            border: 1px solid transparent;
        }
        .sidebar-item:hover { background: var(--bg-secondary); }
        .sidebar-item.active {
            border-color: #667eea;
            background: #f9fafb;
            border-left: 3px solid #667eea;
            box-shadow: 0 2px 6px rgba(102,126,234,0.1);
            border-color: #667eea !important;
        }
        .sidebar-item-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 88px;
        }
        .sidebar-item-meta {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            gap: 8px;
        }
        .sidebar-item-delete {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-item:hover .sidebar-item-delete { display: flex; }
        .sidebar-item-delete:hover {
            background: #ef4444;
            color: #fff;
            transform: translateY(-50%) scale(1.15);
            box-shadow: 0 2px 8px rgba(239,68,68,0.3);
        }

        .sidebar-item-pin, .sidebar-item-edit {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-item-pin { right: 36px; }
        .sidebar-item-edit { right: 62px; }
        .sidebar-item:hover .sidebar-item-pin,
        .sidebar-item:hover .sidebar-item-edit { display: flex; }
        .sidebar-item-pin:hover { background: #f59e0b; color: #fff; }
        .sidebar-item-edit:hover { background: #3b82f6; color: #fff; }
        .sidebar-item.pinned .sidebar-item-pin { display: flex; color: #f59e0b; }

        .sidebar-toggle {
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 32px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            z-index: 101;
        }
        .sidebar-toggle:hover { 
            background: var(--accent-color); 
            color: white; 
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 2px 8px rgba(102,126,234,0.3);
        }
        .sidebar.collapsed .sidebar-toggle {
            right: -10px;
            left: auto;

        // ==================== 🆕 导出对话功能（Markdown 格式） ====================
        function exportChat() {
            const messages = document.querySelectorAll('.message');
            let exportText = '';

            // Markdown 标题
            exportText += '# 🤖 AI 对话助手 - 对话记录\n\n';
            exportText += `**导出时间**: ${new Date().toLocaleString('zh-CN')}\n\n`;
            exportText += '---\n\n';

            messages.forEach((msg, index) => {
                const isUser = msg.classList.contains('user');
                const timestamp = msg.querySelector('.message-timestamp')?.textContent || '';
                const content = msg.querySelector('.message-content').innerHTML;

                // 转换 HTML 为纯文本（保留 Markdown 格式）
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;

                // 处理代码块
                tempDiv.querySelectorAll('pre code').forEach(code => {
                    const lang = code.className.match(/language-(\w+)/)?.[1] || '';
                    const codeText = code.textContent;
                    const pre = code.parentElement;
                    pre.outerHTML = `\n\`\`\`${lang}\n${codeText}\n\`\`\`\n`;
                });

                // 处理行内代码
                tempDiv.querySelectorAll('code').forEach(code => {
                    code.outerHTML = `\`${code.textContent}\``;
                });

                // 处理链接
                tempDiv.querySelectorAll('a').forEach(a => {
                    a.outerHTML = `[${a.textContent}](${a.href})`;
                });

                // 处理加粗
                tempDiv.querySelectorAll('strong').forEach(strong => {
                    strong.outerHTML = `**${strong.textContent}**`;
                });

                // 处理斜体
                tempDiv.querySelectorAll('em').forEach(em => {
                    em.outerHTML = `*${em.textContent}*`;
                });

                // 处理标题
                tempDiv.querySelectorAll('h1').forEach(h => {
                    h.outerHTML = `\n# ${h.textContent}\n`;
                });
                tempDiv.querySelectorAll('h2').forEach(h => {
                    h.outerHTML = `\n## ${h.textContent}\n`;
                });
                tempDiv.querySelectorAll('h3').forEach(h => {
                    h.outerHTML = `\n### ${h.textContent}\n`;
                });

                // 处理列表
                tempDiv.querySelectorAll('ul').forEach(ul => {
                    const items = Array.from(ul.querySelectorAll('li')).map(li => `- ${li.textContent}`).join('\n');
                    ul.outerHTML = `\n${items}\n`;
                });

                tempDiv.querySelectorAll('ol').forEach(ol => {
                    const items = Array.from(ol.querySelectorAll('li')).map((li, i) => `${i+1}. ${li.textContent}`).join('\n');
                    ol.outerHTML = `\n${items}\n`;
                });

                // 处理引用
                tempDiv.querySelectorAll('blockquote').forEach(quote => {
                    const lines = quote.textContent.split('\n').map(line => `> ${line}`).join('\n');
                    quote.outerHTML = `\n${lines}\n`;
                });

                // 处理表格
                tempDiv.querySelectorAll('table').forEach(table => {
                    let tableText = '\n';
                    const rows = table.querySelectorAll('tr');
                    rows.forEach((row, rowIndex) => {
                        const cells = row.querySelectorAll('th, td');
                        tableText += '| ' + Array.from(cells).map(cell => cell.textContent).join(' | ') + ' |\n';
                        if (rowIndex === 0) {
                            tableText += '| ' + Array.from(cells).map(() => '---').join(' | ') + ' |\n';
                        }
                    });
                    table.outerHTML = tableText;
                });

                const finalContent = tempDiv.textContent.trim();

                // Markdown 格式输出
                if (isUser) {
                    exportText += `## 👤 用户\n`;
                    exportText += `> *${timestamp}*\n\n`;
                    exportText += `${finalContent}\n\n`;
                } else {
                    exportText += `## 🤖 AI 助手\n`;
                    exportText += `> *${timestamp}*\n\n`;
                    exportText += `${finalContent}\n\n`;
                }

                exportText += '---\n\n';
            });

            // 创建下载（改为 .md 文件）
            const blob = new Blob([exportText], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat_${new Date().getTime()}.md`;  // 改为 .md 扩展名
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showNotification('对话已导出为 Markdown 格式', 'success');
        }

        function toggleSidebar() {

        // ==================== 🆕 侧边栏拖动调整宽度 ====================
        let isResizing = false;
        let startX = 0;
        let startWidth = 0;

        function initSidebarResizer() {
            const resizer = document.getElementById('sidebarResizer');
            const sidebar = document.getElementById('sidebar');
            const chatContainer = document.getElementById('chatContainer');

            resizer.addEventListener('mousedown', function(e) {
                isResizing = true;
                startX = e.clientX;
                startWidth = sidebar.offsetWidth;
                document.addEventListener('mousemove', resizeSidebar);
                document.addEventListener('mouseup', stopResize);
                document.body.style.cursor = 'col-resize';
            });

            function resizeSidebar(e) {
                if (!isResizing) return;
                
                const minWidth = 180;
                const maxWidth = 400;
                const deltaX = e.clientX - startX;
                let newWidth = startWidth + deltaX;
                
                // 限制宽度范围
                newWidth = Math.max(minWidth, Math.min(maxWidth, newWidth));
                
                sidebar.style.width = newWidth + 'px';
                chatContainer.style.marginLeft = (newWidth + 20) + 'px';
                
                // 保存宽度到 localStorage
                localStorage.setItem('sidebarWidth', newWidth);
            }

            function stopResize() {
                isResizing = false;
                document.removeEventListener('mousemove', resizeSidebar);
                document.removeEventListener('mouseup', stopResize);
                document.body.style.cursor = 'default';
            }
        }

        // 加载保存的侧边栏宽度
        function loadSidebarWidth() {
            const savedWidth = localStorage.getItem('sidebarWidth');
            const sidebar = document.getElementById('sidebar');
            const chatContainer = document.getElementById('chatContainer');
            
            if (savedWidth) {

        }

        // ==================== 🆕 自定义滚动条功能 ====================
        function initCustomScrollbar() {
            const list = document.getElementById('sidebarList');
            const wrapper = document.getElementById('sidebarListWrapper');
            const scrollbar = document.getElementById('customScrollbar');
            const thumb = document.getElementById('customScrollbarThumb');
            
            if (!list || !wrapper || !scrollbar || !thumb) return;
            
            const thumbHeight = 80; // 滑块固定高度
            
            function updateScrollbar() {
                const scrollHeight = list.scrollHeight;
                const clientHeight = list.clientHeight;
                const scrollTop = list.scrollTop;
                
                // 检查是否需要显示滚动条
                if (scrollHeight > clientHeight) {
                    wrapper.classList.add('scrollable');
                    const maxScroll = scrollHeight - clientHeight;
                    const maxThumbTop = scrollbar.offsetHeight - thumbHeight;
                    const thumbTop = (scrollTop / maxScroll) * maxThumbTop;
                    thumb.style.top = Math.max(0, Math.min(maxThumbTop, thumbTop)) + 'px';
                } else {
                    wrapper.classList.remove('scrollable');
                }
            }
            
            // 监听滚动事件
            list.addEventListener('scroll', updateScrollbar);
            
            // 鼠标拖动滑块
            let isDragging = false;
            let startY = 0;
            let startScrollTop = 0;
            
            thumb.addEventListener('mousedown', function(e) {
                isDragging = true;
                startY = e.clientY;
                startScrollTop = list.scrollTop;
                document.addEventListener('mousemove', onDrag);
                document.addEventListener('mouseup', stopDrag);
            });
            
            function onDrag(e) {
                if (!isDragging) return;
                const scrollbarHeight = scrollbar.offsetHeight;
                const scrollHeight = list.scrollHeight;
                const clientHeight = list.clientHeight;
                const maxScroll = scrollHeight - clientHeight;
                const maxThumbTop = scrollbarHeight - thumbHeight;
                const deltaY = e.clientY - startY;
                const deltaScroll = (deltaY / maxThumbTop) * maxScroll;
                list.scrollTop = Math.max(0, Math.min(maxScroll, startScrollTop + deltaScroll));
            }
            
            function stopDrag() {
                isDragging = false;
                document.removeEventListener('mousemove', onDrag);
                document.removeEventListener('mouseup', stopDrag);
            }
            
            // 点击滚动条轨道
            scrollbar.addEventListener('click', function(e) {
                if (e.target === scrollbar) {
                    const rect = scrollbar.getBoundingClientRect();
                    const clickY = e.clientY - rect.top;
                    const scrollbarHeight = scrollbar.offsetHeight;
                    const scrollHeight = list.scrollHeight;
                    const clientHeight = list.clientHeight;
                    const maxScroll = scrollHeight - clientHeight;
                    const ratio = clickY / scrollbarHeight;
                    list.scrollTop = ratio * maxScroll;
                }
            });
            
            // 初始化
            updateScrollbar();
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadSidebarWidth();
            initSidebarResizer();
            initCustomScrollbar();
        });

        function loadSessions() {
            return fetch('/api/list_sessions')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('sidebarList');
                    if (!data.success || !data.sessions || data.sessions.length === 0) {
                        list.innerHTML = '<div class="sidebar-loading">暂无会话</div>';
                        return;
                    }
                    let html = '';
                    data.sessions.forEach(s => {
                        // 格式化时间戳
                        let timeStr = '';
                        if (s.updated_at) {
                            const d = new Date(s.updated_at);
                            const mm = String(d.getMonth() + 1).padStart(2, '0');
                            const dd = String(d.getDate()).padStart(2, '0');
                            const hh = String(d.getHours()).padStart(2, '0');
                            const min = String(d.getMinutes()).padStart(2, '0');
                            timeStr = `${mm}/${dd} ${hh}:${min}`;
                        }
                        
                        const displayName = s.custom_name || s.summary || '新会话';
                        const pinnedClass = s.pinned ? ' pinned' : '';
                        const pinIcon = s.pinned ? '📌' : '📌';
                        const pinTitle = s.pinned ? '取消置顶' : '置顶';
                        html += '<div class="sidebar-item' + pinnedClass + '" data-sid="' + s.session_id + '" onclick="switchToSession(\'' + s.session_id + '\')">' +
                            '<div class="sidebar-item-dot"></div>' +
                            '<div class="sidebar-item-content">' +
                                '<div class="sidebar-item-title" ondblclick="event.stopPropagation(); renameSession(\'' + s.session_id + '\', \'' + escapeHtml(displayName).replace(/'/g, "\\'") + '\')">' + escapeHtml(displayName) + '</div>' +
                                '<div class="sidebar-item-time">' + timeStr + '</div>' +
                            '</div>' +
                            '<button class="sidebar-item-edit" onclick="event.stopPropagation(); renameSession(\'' + s.session_id + '\', \'' + escapeHtml(displayName).replace(/'/g, "\\'") + '\')" title="重命名">✎</button>' +
                            '<button class="sidebar-item-pin" onclick="event.stopPropagation(); togglePinById(\'' + s.session_id + '\')" title="' + pinTitle + '">' + pinIcon + '</button>' +
                            '<button class="sidebar-item-delete" onclick="event.stopPropagation(); deleteSessionById(\'' + s.session_id + '\')" title="删除">×</button>' +
                            '</div>';
                    });
                    list.innerHTML = html;
                })
                .catch(err => {
                    document.getElementById('sidebarList').innerHTML = '<div class="sidebar-loading">加载失败</div>';
                });
        }

        function newSession() {
            fetch('/api/reset_session', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        // 清空聊天区并展示欢迎消息
                        document.getElementById('chatMessages').innerHTML = `
                            <div class="message ai">
                                <div class="message-timestamp">${getTimestamp()}</div>
                                <div class="message-content">
                                    你好！我是AI助手，有什么可以帮助你的吗？
                                </div>
                            </div>
                        `;
                        // 刷新侧边栏列表，加载完成后高亮新会话
                        loadSessions().then(() => {
                            if (data.new_session_id) {
                                const items = document.querySelectorAll('.sidebar-item');
                                items.forEach(item => item.classList.remove('active'));
                                const newItem = document.querySelector(`.sidebar-item[data-sid="${data.new_session_id}"]`);
                                if (newItem) {
                                    newItem.classList.add('active');
                                }
                            }
                        });
                    } else if (data.session_limit_reached) {
                        alert('会话已超过最大值 ' + data.max_sessions + '，请先删除历史会话。');
                    }
                });
        }

        function switchToSession(targetId) {
            // 直接切换，不弹 confirm，不刷新页面
            fetch('/api/load_session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: targetId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // 清空当前聊天区域
                    const chatMessages = document.getElementById('chatMessages');
                    chatMessages.innerHTML = '';

                    // 渲染历史消息
                    if (data.history && data.history.length > 0) {
                        data.history.forEach(msg => {
                            addMessage(msg.content, msg.role);
                        });
                    } else {
                        // 空会话，显示欢迎消息
                        chatMessages.innerHTML = `
                            <div class="message ai">
                                <div class="message-timestamp">${getTimestamp()}</div>
                                <div class="message-content">
                                    你好！我是AI助手，有什么可以帮助你的吗？
                                </div>
                            </div>
                        `;
                    }

                    // 更新模型和场景 UI
                    if (data.current_model) {
                        updateModelStatus(data.current_model);
                    }
                    if (data.current_scene) {
                        document.getElementById('sceneSelect').value = data.current_scene;
                        const sceneNames = {
                            'general': '通用对话',
                            'python': 'Python',
                            'java': 'Java',
                            'sql': 'SQL',
                            'debug': '调试排错',
                            'shell': 'Shell'
                        };
                        document.getElementById('currentScene').textContent =
                            sceneNames[data.current_scene] || data.current_scene;
                    }

                    // 高亮当前会话
                    document.querySelectorAll('.sidebar-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    const currentItem = document.querySelector(`.sidebar-item[data-sid="${targetId}"]`);
                    if (currentItem) {
                        currentItem.classList.add('active');
                    }

                    // 滚动到底部
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                } else {
                    showNotification('切换会话失败: ' + (data.error || '未知错误'), 'error');
                }
            })
            .catch(err => {
                console.error('切换会话失败:', err);
                showNotification('切换会话失败，请检查网络连接', 'error');
            });
        }

        function renameSession(sid, currentName) {
            const newName = prompt('请输入会话名称：', currentName || '');
            if (!newName || newName.trim() === '' || newName.trim() === currentName) return;
            fetch('/api/rename_session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sid, name: newName.trim() })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadSessions();
                }
            });
        }

        function togglePinById(sid) {
            fetch('/api/toggle_pin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sid })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadSessions();
                }
            });
        }

        function deleteSessionById(sid) {
            fetch('/api/delete_session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sid })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) { loadSessions(); }
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || 'New Session';
            return div.innerHTML;
        }

        (function() {
            if (localStorage.getItem('sidebarCollapsed') === 'true') {
                document.getElementById('sidebar').classList.add('collapsed');
                document.getElementById('chatContainer').classList.add('sidebar-collapsed');
                document.getElementById('sidebarExpandBtn').classList.add('visible');
            }
        })();


        window.onload = async function() {
            await loadModels();
            await loadScenes();
            loadSessions();
        };

        async function loadModels() {
            try {
                const response = await fetch(`${API_BASE}/get_models`);
                const data = await response.json();

                if (data.success) {
                    const modelSelect = document.getElementById('modelSelect');
                    modelSelect.innerHTML = '';

                    data.models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.id;
                        option.textContent = model.name;
                        if (model.value === data.current_model) {
                            option.selected = true;
                        }
                        modelSelect.appendChild(option);
                    });

                    updateModelStatus(data.current_model);
                }
            } catch (error) {
                console.error('加载模型失败:', error);
            }
        }

        async function loadScenes() {
            try {
                const response = await fetch(`${API_BASE}/get_scenes`);
                const data = await response.json();

                if (data.success) {
                    const sceneSelect = document.getElementById('sceneSelect');
                    sceneSelect.innerHTML = '';

                    const sceneNames = {
                        'general': '通用对话',
                        'code': '代码助手',
                        'creative': '创意写作'
                    };

                    data.scenes.forEach(scene => {
                        const option = document.createElement('option');
                        option.value = scene;
                        option.textContent = sceneNames[scene] || scene;
                        sceneSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载场景失败:', error);
            }
        }

        document.getElementById('modelSelect').addEventListener('change', async function() {
            const modelId = this.value;

            try {
                const response = await fetch(`${API_BASE}/switch_model`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model_id: modelId })
                });

                const data = await response.json();

                if (data.success) {
                    addSystemMessage(data.message);
                    updateModelStatus(data.current_model);
                    showNotification('模型切换成功', 'success');
                } else {
                    showNotification('切换模型失败: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('切换模型失败:', error);
                showNotification('切换模型失败，请检查网络连接', 'error');
            }
        });

        document.getElementById('sceneSelect').addEventListener('change', async function() {
            const scene = this.value;

            try {
                const response = await fetch(`${API_BASE}/switch_scene`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scene: scene })
                });

                const data = await response.json();

                if (data.success) {
                    addSystemMessage(data.message);
                    document.getElementById('currentScene').textContent =
                        document.getElementById('sceneSelect').selectedOptions[0].text;
                    showNotification('场景切换成功', 'success');
                } else {
                    showNotification('切换场景失败: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('切换场景失败:', error);
                showNotification('切换场景失败，请检查网络连接', 'error');
            }
        });

        function updateModelStatus(modelValue) {
            const modelSelect = document.getElementById('modelSelect');
            const selectedOption = Array.from(modelSelect.options).find(
                opt => opt.value === modelSelect.value
            );
            document.getElementById('currentModel').textContent =
                selectedOption ? selectedOption.textContent : modelValue;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();

            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            showLoading(true);

            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (data.success) {
                    addMessage(data.reply, 'ai');
                } else {
                    addMessage('抱歉，出现错误: ' + data.error, 'ai');
                    showNotification('发送失败', 'error');
                }
            } catch (error) {
                console.error('发送失败:', error);
                addMessage('网络错误，请检查连接', 'ai');
                showNotification('网络错误', 'error');
            } finally {
                showLoading(false);
            }
        }

        // 🆕 修改添加消息函数，支持时间戳
        function addMessage(content, role) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            const isAi = role === 'ai' || role === 'assistant';
            const isUser = role === 'user';
            messageDiv.className = `message ${isAi ? 'ai' : isUser ? 'user' : role}`;

            // 添加时间戳
            const timestampDiv = document.createElement('div');
            timestampDiv.className = 'message-timestamp';
            timestampDiv.textContent = getTimestamp();
            messageDiv.appendChild(timestampDiv);

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // 统一 role：后端存的是 "assistant"，新消息传的是 "ai"，都视为 AI 消息
            if (isAi) {
                contentDiv.innerHTML = marked.parse(content);

                setTimeout(() => {
                    contentDiv.querySelectorAll('pre code').forEach((block, index) => {
                        const pre = block.parentElement;
                        pre.style.position = 'relative';

                        const lang = block.className.match(/language-(\w+)/)?.[1] || 'text';

                        const langLabel = document.createElement('span');
                        langLabel.className = 'code-lang';
                        langLabel.textContent = lang;
                        pre.appendChild(langLabel);

                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'copy-btn';
                        copyBtn.textContent = '复制';
                        copyBtn.onclick = () => copyCode(block.textContent, copyBtn);
                        pre.appendChild(copyBtn);
                    });
                }, 0);
            } else {
                contentDiv.textContent = content;
            }

            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function copyCode(code, button) {
            navigator.clipboard.writeText(code).then(() => {
                button.textContent = '✓ 已复制';
                button.classList.add('copied');
                setTimeout(() => {
                    button.textContent = '复制';
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
                button.textContent = '复制失败';
            });
        }

        function addSystemMessage(content) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';

            const timestampDiv = document.createElement('div');
            timestampDiv.className = 'message-timestamp';
            timestampDiv.textContent = getTimestamp();
            messageDiv.appendChild(timestampDiv);

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.style.background = '#fff3cd';
            contentDiv.style.color = '#856404';
            contentDiv.textContent = content;

            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showLoading(show) {
            const loading = document.getElementById('loading');
            loading.className = show ? 'loading active' : 'loading';
        }

        async function clearHistory() {
            if (!confirm('确定要清空对话历史吗？')) return;

            try {
                const response = await fetch(`${API_BASE}/clear_history`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('chatMessages').innerHTML = `
                        <div class="message ai">
                            <div class="message-timestamp">${getTimestamp()}</div>
                            <div class="message-content">对话历史已清空，让我们重新开始吧！</div>
                        </div>
                    `;
                    showNotification('对话历史已清空', 'success');
                }
            } catch (error) {
                console.error('清空失败:', error);
                showNotification('清空失败', 'error');
            }
        }

        // 🆕 修改键盘事件处理，支持 Shift+Enter 换行
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function handleKeyPress(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();  // 阻止默认换行
            sendMessage();
        }
        // Shift+Enter 时不做任何处理，让浏览器默认换行
        }


    </script>
</body>
</html>
